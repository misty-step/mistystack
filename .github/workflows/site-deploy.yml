name: Site deploy
on:
  workflow_call:
    inputs:
      revision:
        description: Candidate that passed release CI and critical assessment
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stack-site-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, hetzner-ci, mistystack-ci]
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/cache@v4
        id: dependencies
        with:
          path: site/node_modules
          key: mistystack-site-linux-node22-${{ hashFiles('site/package-lock.json') }}
      - name: Install pinned deployment tools on cache miss
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci
      - name: Download the artifact already checked by release CI
        uses: actions/download-artifact@v4
        with:
          name: mistystack-site-${{ inputs.revision }}
          path: site/dist/
      - name: Deploy the checked bytes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy
      - name: Prove live identity and reading journey
        env:
          BUILT: ${{ inputs.revision }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsSL "https://stack.mistystep.io/?v=$BUILT" | grep -q "$BUILT"; then
              for path in /guide/verify-and-ship/ /library/skills/ship-loop/ /library/skills/watchdog/ /search/; do
                curl -fsS -o /dev/null "https://stack.mistystep.io$path"
              done
              echo "stack.mistystep.io serves $BUILT; delivery/watchdog reading journey passed" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "stack.mistystep.io does not serve $BUILT"; exit 1
