name: Release CI
on:
  workflow_call:
    inputs:
      revision:
        description: Landed release candidate
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, hetzner-ci, mistystack-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Restore pinned release tools
        id: tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mistystack-release-tools
          key: mistystack-release-tools-linux-x64-gitleaks-8.30.1-landmark-0.28.9
      - name: Install missing pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          LANDMARK_SHA256: 7a22cba7d99aa6d05ef113a8ff95ca5ca6098c6bf4a8af213f85370fa30e65d2
        run: |
          tools="$RUNNER_TEMP/mistystack-release-tools"
          mkdir -p "$tools"
          curl --proto '=https' --tlsv1.2 --location --silent --show-error --fail \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$tools/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tools/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
          rm "$tools/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --location --silent --show-error --fail \
            https://github.com/misty-step/landmark/releases/download/v0.28.9/landmark-x86_64-unknown-linux-musl -o "$tools/landmark"
          printf '%s  %s\n' "$LANDMARK_SHA256" "$tools/landmark" | sha256sum --check --strict
          chmod +x "$tools/landmark"
      - name: Check maintained contracts once
        run: |
          export PATH="$RUNNER_TEMP/mistystack-release-tools:$PATH"
          export LANDMARK_BIN="$RUNNER_TEMP/mistystack-release-tools/landmark"
          ./scripts/check plugin --strict --lint-only
      - name: Confirm publication candidate without writing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANDMARK_BIN: ${{ runner.temp }}/mistystack-release-tools/landmark
        run: bun scripts/protected-release-check.ts
  site:
    runs-on: [self-hosted, hetzner-ci, mistystack-ci]
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/cache@v4
        id: dependencies
        with:
          path: site/node_modules
          key: mistystack-site-linux-node22-${{ hashFiles('site/package-lock.json') }}
      - name: Install pinned site dependencies on cache miss
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build and check one deployable artifact
        env:
          SITE_COMMIT: ${{ inputs.revision }}
        run: npm run build && npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: mistystack-site-${{ inputs.revision }}
          path: site/dist/
          include-hidden-files: true
          if-no-files-found: error
